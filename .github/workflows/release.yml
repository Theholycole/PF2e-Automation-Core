# Run by hand (workflow_dispatch) on main, it first publishes the release for module.json's version, with the
# notes given, then packages it the same way.
# A published release (tag vX.Y.Z) gets the installable module: module.json with that version and its
# download URL, and module.zip holding what Foundry loads. Same as the spell module's workflow.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release for module.json's version (run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="v$(jq -r .version module.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released." >&2; exit 1; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --latest
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set the version and the download URL
        run: |
          TAG="${TAG:-$GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          jq --arg version "$VERSION" --arg download "$DOWNLOAD" '.version = $version | .download = $download' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Zip the module
        run: zip -r module.zip module.json LICENSE README.md scripts src

      - name: Attach module.json and module.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" module.json module.zip --clobber
